<html lang="en">

<title>Desert League</title>
<style>
:root{
  --bg:#0b0e15; --bg2:#0f131c; --panel:#141925; --panel2:#1a2130; --line:#232b3b; --line2:#2d3749;
  --txt:#f2f5fa; --dim:#93a0b4; --dim2:#5c687b;
  --red:#e0102f; --red2:#ff3b57; --gold:#ffb81c; --good:#26c281; --bad:#ff4d5e; --warn:#ffb81c; --blue:#3d8bff;
  --qb:#ff6b57; --rb:#38d17c; --wr:#4da3ff; --te:#ffb020; --k:#c084fc; --dst:#9fb3c8;
  --hd:"Avenir Next Condensed","Bahnschrift","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--txt);font:13px/1.4 var(--ui);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit}
a{color:inherit}
.hd{font-family:var(--hd);font-weight:800;text-transform:uppercase;letter-spacing:.4px}
#top{height:58px;display:flex;align-items:center;gap:12px;padding:0 14px;position:sticky;top:0;z-index:5;
  background:linear-gradient(180deg,#151b28 0%,#0f131c 100%);border-bottom:2px solid var(--red);box-shadow:0 2px 14px #0009}
#top:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;
  background:linear-gradient(90deg,var(--red) 0%,var(--red) 55%,var(--gold) 55%,var(--gold) 60%,transparent 60%)}
#brand{display:flex;align-items:center;gap:11px;padding-right:14px;border-right:1px solid var(--line2);height:40px}
#brand .mark{height:32px;width:auto;display:block;filter:drop-shadow(0 2px 5px #0009)}
#brand .t1{font-family:var(--hd);font-weight:900;font-size:20px;letter-spacing:.8px;line-height:1;text-transform:uppercase;white-space:nowrap;
  background:linear-gradient(180deg,#fff,#cfd6e2);-webkit-background-clip:text;background-clip:text;color:transparent}
#brand .t2{font-size:9.5px;font-weight:800;letter-spacing:2px;color:var(--gold);text-transform:uppercase;line-height:1;margin-top:3px}
nav{display:flex;gap:4px}
nav a{padding:0 13px;height:34px;display:inline-flex;align-items:center;border-radius:6px;border:1px solid transparent;
  font-family:var(--hd);font-weight:800;font-size:14px;letter-spacing:.6px;text-transform:uppercase;text-decoration:none;color:var(--dim)}
nav a:hover{color:var(--txt);border-color:var(--line2)}
nav a.on{color:#fff;background:var(--red);border-color:var(--red)}
.spacer{flex:1}
#meta{font-size:11px;color:var(--dim);text-align:right;line-height:1.25}
#meta b{color:var(--txt)}
main{max-width:1240px;margin:0 auto;padding:16px 14px 60px}
h1{font-family:var(--hd);font-weight:900;font-size:26px;letter-spacing:.6px;text-transform:uppercase;line-height:1}
h1 small{font-size:12px;color:var(--dim);letter-spacing:1.5px;display:block;margin-top:5px;font-weight:800}
h2{font-family:var(--hd);font-weight:800;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:2fr 1fr}
@media(max-width:860px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:0 6px 20px #0006}
.card.hot{border-color:#7a2a1a;background:linear-gradient(180deg,#1c1520,#141925)}
.callout{border-left:4px solid var(--gold);background:#1a1a12;border-radius:8px;padding:12px 14px;margin:12px 0;font-size:13.5px;line-height:1.5}
.callout b{color:var(--gold)}
.callout.red{border-left-color:var(--red2);background:#1e1216}
.callout.red b{color:var(--red2)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);font-weight:800;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.me td{background:#1d1b12}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pos{display:inline-block;min-width:32px;text-align:center;font-family:var(--hd);font-weight:800;font-size:11px;letter-spacing:.5px;
  padding:2px 5px;border-radius:4px;color:#0b0e15}
.pos.QB{background:var(--qb)}.pos.RB{background:var(--rb)}.pos.WR{background:var(--wr)}.pos.TE{background:var(--te)}.pos.K{background:var(--k)}.pos.DST{background:var(--dst)}
.tm{color:var(--dim);font-size:11px;margin-left:4px}
.inj{color:var(--bad);font-size:10px;font-weight:800;margin-left:4px}
.good{color:var(--good);font-weight:800}.bad{color:var(--bad);font-weight:800}.dim{color:var(--dim)}.gold{color:var(--gold);font-weight:800}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--dim);margin-left:6px}
.tag.ok{border-color:#1e6a49;color:#8ff0c2}
.tag.warn{border-color:#7a5c12;color:var(--gold)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);font-size:11.5px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:0 12px;height:32px;border:1px solid var(--line2);border-radius:6px;background:var(--panel2);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#4a5770}
.btn.on{background:var(--red);border-color:var(--red);color:#fff}
input[type=search]{height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);color:var(--txt);min-width:200px}
input[type=range]{accent-color:var(--red)}
textarea{width:100%;min-height:200px;background:var(--panel2);color:var(--txt);border:1px solid var(--line2);border-radius:8px;padding:10px;font:13px/1.5 ui-monospace,Menlo,monospace}
.deal{display:grid;grid-template-columns:1fr auto 1fr auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--bg2)}
.deal .side .ln{display:block;font-size:13px}
.deal .side .sub{display:block;font-size:11px;color:var(--dim)}
.deal .arrow{font-family:var(--hd);font-weight:900;color:var(--gold);font-size:16px}
.deal .num{text-align:right;line-height:1.2;min-width:96px}
.deal .num b{font-family:var(--hd);font-size:18px;display:block}
.deal .num small{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-weight:800}
.deal.top{border-color:#7a2a1a}
.opp{margin-top:14px}
.opp h3{font-family:var(--hd);font-weight:800;font-size:17px;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.opp h3 span{font:12px var(--ui);color:var(--dim);text-transform:none;letter-spacing:0}
.needs{font-size:12px;color:var(--dim);margin:4px 0 6px}
.needs b{color:var(--txt)}
.chk{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--line2);border-radius:6px;margin:3px 3px 0 0;font-size:12px;cursor:pointer;user-select:none}
.chk.off{opacity:.45;text-decoration:line-through}
.plan li{list-style:none;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.plan li:last-child{border-bottom:none}
.plan .no{font-family:var(--hd);font-weight:900;font-size:20px;color:var(--gold);text-align:center}
.plan .what .ln{font-size:13.5px}
.plan .what .sub{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.plan .g{text-align:right;line-height:1.15}
.plan .g b{font-family:var(--hd);font-size:18px;display:block}
.plan .g small{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-weight:800}
.bye{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.bye div{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:11px}
.bye div b{display:block;font-family:var(--hd);font-size:14px}
.bye div.hot{border-color:#7a2a1a;background:#1e1216}
.bm{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:8px;background:var(--red);color:#fff;font-family:var(--hd);font-weight:900;font-size:18px;letter-spacing:.8px;text-transform:uppercase;text-decoration:none;cursor:grab;border:2px dashed #ff8090}
code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12.5px}
ol{padding-left:22px}ol li{margin:6px 0}
.scroll{overflow-x:auto}
#gate{display:flex;align-items:center;justify-content:center;min-height:70vh;color:var(--dim2);font-family:var(--hd);font-size:22px;letter-spacing:2px;text-transform:uppercase}
@media(max-width:700px){
  #brand>div{display:none}
  #meta{display:none}
  nav a{padding:0 9px;font-size:13px}
  main{padding:12px 10px 60px}
  .deal{grid-template-columns:1fr auto 1fr;gap:6px}
  .deal .num{grid-column:1/-1;display:flex;justify-content:space-between;text-align:left}
  .deal .num b{display:inline;font-size:16px}
  td,th{padding:5px 6px}
}
</style>
</head>

<script>
const PAGE='trades';
const D=JSON.parse(document.getElementById('edgedata').textContent);
const qs=new URLSearchParams(location.search);
function djb2(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h*33)^s.charCodeAt(i))>>>0; } return h.toString(16); }
/* Same gate as the draft rooms: strategy renders only for a browser that has
   presented the master key once (?key=…, cached, stripped from the URL). */
const COACH=(()=>{
  if(!D.coachKeyHash) return true;
  if(location.protocol==='file:') return true;
  const cached=localStorage.getItem('snakepit.coach');
  if(cached && djb2(cached)===D.coachKeyHash) return true;
  const k=qs.get('key');
  if(k && djb2(k)===D.coachKeyHash){
    localStorage.setItem('snakepit.coach',k);
    try{ const u=new URL(location.href); u.searchParams.delete('key'); history.replaceState(null,'',u.toString()); }catch(e){}
    return true;
  }
  return false;
})();
document.getElementById('nav-'+PAGE).classList.add('on');
document.getElementById('nav-war').href=D.warRoom;

/* ================= engine =================
   HARD league rule: exactly QB2 / RB3 / WR+TE 5 / K2 / DST2. Everyone starts.
   Every pickup is a one-for-one swap inside the same slot. Total-points standings,
   so a player's value is simply his projected points. */
const SLOTS=D.rules.slots, SLOT_OF=D.rules.slotOf, ROSTER=D.rules.roster;
const SLOT_KEYS=Object.keys(SLOTS);
const P={}; D.players.forEach(p=>P[p.id]=p);
const teams=D.teams; const me=teams.find(t=>t.me); const opps=teams.filter(t=>!t.me);
const rostered=new Set(); teams.forEach(t=>t.roster.forEach(id=>rostered.add(id)));
const POSN=['QB','RB','WR','TE','K','DST'];
const slotName={QB:'QB',RB:'RB',WRTE:'WR/TE',K:'K',DST:'D/ST'};
const fmt=n=>(n>=0?'+':'')+Math.round(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slot=p=>SLOT_OF[p.pos];

// best legal lineup under the fixed slots
function lineup(ids){
  const ps=ids.map(id=>P[id]).sort((a,b)=>b.pts-a.pts);
  const cnt={}; let total=0, n=0; const used=[];
  for(const p of ps){ const s=slot(p); if((cnt[s]||0)>=SLOTS[s]) continue; cnt[s]=(cnt[s]||0)+1; total+=p.pts; n++; used.push(p.id); }
  return {total,used,cnt,n};
}
const FA=D.players.filter(p=>!rostered.has(p.id)&&p.pts>0).sort((a,b)=>b.pts-a.pts);
const faBySlot=s=>FA.filter(p=>slot(p)===s);
// replacement = best free agent in the slot: what a swap could get you today
const REPL={}; SLOT_KEYS.forEach(s=>{ const b=faBySlot(s)[0]; REPL[s]=b?b.pts:0; });
function V(ids){ return lineup(ids).total; }
// what the other owners SEE: rtsports' own weekly projection on their lineup page
function rts(p){ return p.rts==null?(p.week||0):p.rts; }
function player(p,extra){ return `<span class="pos ${p.pos}">${p.pos==='DST'?'D/ST':p.pos}</span> <b>${esc(p.name)}</b><span class="tm">${esc(p.team)} · bye ${p.bye||'–'}</span>${p.inj?`<span class="inj">${esc(p.inj)}</span>`:''}${extra||''}`; }
function short(p){ return p.pos==='DST'?p.team:p.name.split(' ').pop(); }
const CITY={ARI:'Arizona',ATL:'Atlanta',BAL:'Baltimore',BUF:'Buffalo',CAR:'Carolina',CHI:'Chicago',CIN:'Cincinnati',CLE:'Cleveland',DAL:'Dallas',DEN:'Denver',DET:'Detroit',GB:'Green Bay',HOU:'Houston',IND:'Indianapolis',JAX:'Jacksonville',KC:'Kansas City',LV:'Las Vegas',LAC:'Los Angeles Chargers',LAR:'Los Angeles Rams',MIA:'Miami',MIN:'Minnesota',NE:'New England',NO:'New Orleans',NYG:'New York Giants',NYJ:'New York Jets',PHI:'Philadelphia',PIT:'Pittsburgh',SF:'San Francisco',SEA:'Seattle',TB:'Tampa Bay',TEN:'Tennessee',WSH:'Washington'};

/* Swap plan: greedy one-for-one, same slot, biggest net gain first, each side used once. */
function swapPlan(rosterIds,minGain,max){
  const plan=[]; let r=rosterIds.slice(); const added=new Set(), dropped=new Set();
  for(let i=0;i<max;i++){
    let best=null,bg=minGain;
    for(const d of r){ if(added.has(d)) continue; const s=slot(P[d]);
      for(const f of faBySlot(s).slice(0,25)){ if(added.has(f.id)) continue; const g=f.pts-P[d].pts; if(g>bg){bg=g;best={f,d};} } }
    if(!best) break;
    const s=slot(best.f);
    const backups=faBySlot(s).filter(p=>p!==best.f&&!added.has(p.id)&&p.pts>P[best.d].pts+minGain).slice(0,3);
    plan.push({p:best.f,drop:P[best.d],gain:bg,backups}); added.add(best.f.id); dropped.add(best.d); r=r.filter(x=>x!==best.d).concat(best.f.id);
  }
  return plan;
}

/* ================= render ================= */
const main=document.getElementById('main');
document.getElementById('meta').innerHTML=`<b>Week ${D.week}</b> · ${D.weeksLeft} weeks left<br>ESPN proj ${esc(D.projDate)} · built ${esc(D.built)}`;
if(!COACH){ /* stay a blank shell */ }
else if(PAGE==='trades') renderTrades(); else if(PAGE==='waivers') renderWaivers(); else renderSpeed();

function powerTable(){
  const rows=teams.map(t=>({t,now:V(t.roster)})).sort((a,b)=>b.now-a.now);
  const mine=rows.find(r=>r.t.me).now;
  return `<div class="card"><h2>Projected rest-of-season standings</h2>
  <div class="scroll"><table><tr><th>#</th><th>Team</th><th class="n">Projected pts</th><th class="n">vs me</th>${SLOT_KEYS.map(s=>`<th class="n">${slotName[s]}</th>`).join('')}</tr>
  ${rows.map((r,i)=>{const L=lineup(r.t.roster); const by={}; L.used.forEach(id=>{const s=slot(P[id]); by[s]=(by[s]||0)+P[id].pts;});
    return `<tr class="${r.t.me?'me':''}"><td>${i+1}</td><td><b>${esc(r.t.name)}</b><span class="tm">${esc(r.t.owner)}</span></td><td class="n"><b>${Math.round(r.now)}</b></td><td class="n ${r.t.me?'dim':r.now>mine?'bad':'good'}">${r.t.me?'—':fmt(mine-r.now)}</td>${SLOT_KEYS.map(s=>`<td class="n">${Math.round(by[s]||0)}</td>`).join('')}</tr>`;}).join('')}
  </table></div>
  <p class="dim" style="margin-top:8px;font-size:11.5px">Total-points league, fixed lineup QB2 · RB3 · WR/TE5 · K2 · D/ST2, everyone starts. Best free agent by slot right now: ${SLOT_KEYS.map(s=>`${slotName[s]} ${Math.round(REPL[s])}`).join(' · ')}.</p></div>`;
}

function renderTrades(){
  const untouch=new Set(JSON.parse(localStorage.getItem('desert.untouch')||'[]'));
  let minGain=+(localStorage.getItem('desert.minGain')||10);
  function deals(){
    const out=[]; const mine=me.roster.filter(id=>!untouch.has(id)); const base=V(me.roster);
    for(const o of opps){
      const ob=V(o.roster);
      for(const a of mine){ for(const b of o.roster){
        if(slot(P[a])!==slot(P[b])) continue;            // one-for-one, same slot — league rule
        const myNew=me.roster.filter(id=>id!==a).concat(b), thNew=o.roster.filter(id=>id!==b).concat(a);
        const mg=V(myNew)-base, tg=V(thNew)-ob;
        if(mg<minGain) return_=0; if(mg<minGain) continue;
        const paperGet=rts(P[a]), paperGive=rts(P[b]); const paper=paperGet-paperGive; // >0: on rtsports it looks like THEY win
        const sell=tg>=-2?2:(paper>=-0.3?1:(paper>=-1.5?0:-1));
        if(sell<0) continue;
        out.push({o,give:[a],get:[b],mg,tg,paper,paperGet,paperGive,sell,score:mg+(sell===2?8:sell===1?4:-6)});
      } }
    }
    return out.sort((a,b)=>b.score-a.score);
  }
  function needs(o){
    const L=lineup(o.roster); const parts=[];
    SLOT_KEYS.forEach(s=>{ const have=(L.cnt[s]||0); if(have<SLOTS[s]) parts.push(`<b>short ${SLOTS[s]-have} at ${slotName[s]}</b>`); });
    const weak=o.roster.map(id=>P[id]).sort((a,b)=>a.pts-b.pts).slice(0,2);
    parts.push(`weakest: ${weak.map(p=>`${esc(p.name)} (${Math.round(p.pts)})`).join(', ')}`);

/* ================= compare tool ================= */
const norm=s=>String(s).toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\b\.?/g,'').replace(/[^a-z]/g,'');
const byName={}; D.players.forEach(p=>{ byName[norm(p.name)]=p; if(p.pos==='DST'){ const nick=p.name.replace(/ D\/ST$/,''); [p.team+' dst',p.team+' defense',p.team,nick,nick+' defense',nick+' d',(CITY[p.team]||'')+' defense',(CITY[p.team]||'')+' dst',(CITY[p.team]||'')].forEach(k=>{ if(k.trim()) byName[norm(k)]=byName[norm(k)]||p; }); } });
function findPlayer(txt){ if(!txt) return null; const n=norm(txt); if(byName[n]) return byName[n];
  // partial: last name, or start of name — prefer higher-projected
  const c=D.players.filter(p=>{const pn=norm(p.name); return pn.includes(n)||n.includes(norm(p.name.split(' ').pop()))&&n.length>=4;}).sort((a,b)=>b.pts-a.pts);
  return c[0]||null; }
function parseQuestion(q){
  // find the two best name matches inside a free-text question
  const words=q.replace(/[?.,!]/g,' ').split(/\s+/).filter(Boolean); const hits=[];
  for(let i=0;i<words.length;i++){ for(let len=3;len>=1;len--){ const phrase=words.slice(i,i+len).join(' '); if(phrase.length<4) continue; const n=norm(phrase);
      const exact=byName[n]; if(exact){ if(!hits.find(h=>h.p===exact)) hits.push({p:exact,i}); i+=len-1; break; } } }
  if(hits.length<2){ // fallback: any word that's a unique last name
    for(let i=0;i<words.length;i++){ const w=norm(words[i]); if(w.length<4) continue; const m=D.players.filter(p=>norm(p.name.split(' ').pop())===w).sort((a,b)=>b.pts-a.pts); if(m.length&&!hits.find(h=>h.p===m[0])) hits.push({p:m[0],i}); } }
  hits.sort((a,b)=>a.i-b.i); return hits.slice(0,2).map(h=>h.p);
}
function ownerOf(p){ const t=teams.find(t=>t.roster.includes(p.id)); return t?t.name:'Free agent'; }
function posRank(p){ return D.players.filter(x=>x.pos===p.pos&&x.pts>p.pts).length+1; }
function renderCompare(a,b){

  const gp=x=>x.gp||Math.max(1,D.week-1);

  const sk=[['passYd','Pass yds'],['passTD','Pass TD'],['rushYd','Rush yds'],['rushTD','Rush TD'],['rec','Receptions'],['recYd','Rec yds'],['recTD','Rec TD'],
    ['fgMade','Field goals made'],['fgAtt','Field goal attempts'],['xpMade','Extra points'],
    ['sacks','Sacks'],['ints','Interceptions'],['fumRec','Fumble recoveries'],['defTD','Defensive / return TDs'],['safeties','Safeties'],['blocks','Blocked kicks'],['lowPAgames','Games allowing 10 or fewer']];
  sk.forEach(([k,l])=>{ const va=(a.stats||{})[k], vb=(b.stats||{})[k]; if(va||vb) R(l+' (proj)',va||0,vb||0,v=>Number.isInteger(v)?v:v.toFixed(1)); });
  if((a.stats||{}).paPerGame||(b.stats||{}).paPerGame) R('Points allowed per game (proj)',(a.stats||{}).paPerGame,(b.stats||{}).paPerGame,v=>v==null?'–':v.toFixed(1),false);
  const sameSlot=slot(a)===slot(b);
  const mine=me.roster.includes(a.id)?a:me.roster.includes(b.id)?b:null; const other=mine===a?b:a;
  const facts=[[ 'Team / opponent', `${a.team} ${a.opp||''}`, `${b.team} ${b.opp||''}`],['Bye week',a.bye||'–',b.bye||'–'],['Injury',a.inj||'healthy',b.inj||'healthy'],['Who has him',ownerOf(a),ownerOf(b)]];
  const win=(r)=>{ if(r.va==null||r.vb==null||r.va===r.vb) return 0; return (r.higher?r.va>r.vb:r.va<r.vb)?-1:1; };
  const score=rows.reduce((s,r)=>s+win(r),0);
  // verdict: rest-of-season is what total points rewards; this week matters for streaming
  const rosGap=a.pts-b.pts, wkGap=(a.week||0)-(b.week||0);
  const better=rosGap>=0?a:b, worse=better===a?b:a;
  const conf=Math.abs(rosGap)>=40?'clear':Math.abs(rosGap)>=15?'lean':'coin flip';

  else if(mine&&!rostered.has(other.id)){ const g=other.pts-mine.pts; verdict+=g>0?` Swapping <b>${esc(mine.name)}</b> for <b>${esc(other.name)}</b> nets <b class="good">${fmt(g)}</b> rest of season.`:` Keep <b>${esc(mine.name)}</b>: the swap would cost <b class="bad">${fmt(g)}</b>.`; }

  const head=(p,left)=>`<div style="text-align:center;padding:10px 6px;border-radius:8px;background:${(left?rosGap>=0:rosGap<0)?'#163a2a':'var(--bg2)'};border:1px solid ${(left?rosGap>=0:rosGap<0)?'#1e6a49':'var(--line)'}"><div style="font-family:var(--hd);font-weight:900;font-size:18px">${esc(p.name)}</div><div class="dim" style="font-size:11px"><span class="pos ${p.pos}">${p.pos==='DST'?'D/ST':p.pos}</span> ${esc(p.team)} ${esc(p.opp||'')} · bye ${p.bye||'–'}${p.inj?` · <span class="inj">${esc(p.inj)}</span>`:''}</div></div>`;

  const bar=(r,v,left,w)=>{ const pct=Math.round(Math.abs(v||0)/max(r)*100); return `<div style="display:flex;${left?'justify-content:flex-end':''};align-items:center;gap:6px"><${left?'span':'i'} style="display:inline-block;height:6px;width:${pct}%;max-width:120px;background:${w?'var(--good)':'var(--line2)'};border-radius:3px"></${left?'span':'i'}></div>`; };
  out.innerHTML=`<div class="callout" style="margin:6px 0 10px">${verdict}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px">${head(a,true)}${head(b,false)}</div>
  <div class="scroll"><table>
    ${rows.map(r=>{const w=win(r); return `<tr><td class="n ${w<0?'good':''}" style="width:38%">${r.fmtf(r.va)}${bar(r,r.va,true,w<0)}</td><td style="text-align:center;color:var(--dim);font-size:11px;white-space:normal">${r.label}${r.note?`<br><span style="font-size:10px">${r.note}</span>`:''}</td><td class="${w>0?'good':''}" style="width:38%">${r.fmtf(r.vb)}${bar(r,r.vb,false,w>0)}</td></tr>`;}).join('')}
    ${facts.map(f=>`<tr><td class="n">${esc(f[1])}</td><td style="text-align:center;color:var(--dim);font-size:11px">${f[0]}</td><td>${esc(f[2])}</td></tr>`).join('')}

function wireCompare(){

/* ================= speed kit =================
   Bookmarklets that run INSIDE rtsports on the Add/Drop page and drive the page's
   own functions: selectAddPlayer(id) for the add, the real DROP button for the
   drop, SaveTransactions() to save. A same-origin popup is opened by the click
   (so it isn't blocked) and reloaded at the bell so the site unlocks. */
function parseSwaps(txt){ return txt.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')).map(l=>{const m=l.match(/^(\d+)\s+(.+?)\s+drop\s+(\d+)\s+(.+)$/i); return m?{id:m[1],name:m[2].trim(),drop:m[3],dropName:m[4].trim()}:null;}).filter(Boolean); }
/* The bookmarklet does NOT carry the swap list. It opens the Speed Kit page in
   the popup with #bridge, the page posts the saved list back (postMessage), and
   the popup is then pointed at the Add/Drop page. So the bookmarks are dragged
   once and always run whatever the Speed Kit page currently holds. */
function botSource(mode){
  const SPEED_URL=(location.protocol==='file:'?'https://jmonies33.github.io/snake-pit/desert/speed.html':location.href.split('#')[0].split('?')[0]);
  return `(()=>{
const MODE=${JSON.stringify(mode)};const SPEED=${JSON.stringify(SPEED_URL)};
if(!/add-drop\\.php/.test(location.pathname)){alert('Run this on the rtsports Add/Drop Players page.');return;}
const LOGKEY='dlbot.log';try{if(MODE!=='log')localStorage.setItem(LOGKEY,'--- '+MODE.toUpperCase()+' run started '+new Date().toString()+' ---\\n');}catch(e){}
const log=(m)=>{let b=document.getElementById('dlbot');if(!b){b=document.createElement('pre');b.id='dlbot';b.style.cssText='position:fixed;left:8px;bottom:8px;z-index:99999;max-width:480px;max-height:45vh;overflow:auto;background:#0b0e15;color:#8ff0c2;border:2px solid #e0102f;border-radius:8px;padding:10px;font:12px/1.4 Menlo,monospace;white-space:pre-wrap';document.body.appendChild(b);}const line=new Date().toLocaleTimeString()+'.'+String(Date.now()%1000).padStart(3,'0')+'  '+m;b.textContent+=line+'\\n';b.scrollTop=1e9;try{localStorage.setItem(LOGKEY,(localStorage.getItem(LOGKEY)||'')+line+'\\n');}catch(e){}};
if(MODE==='log'){const t=localStorage.getItem(LOGKEY)||'(no log yet)';const v=window.open('','dlbot_log','width=700,height=600');if(v){v.document.write('<pre style="font:13px Menlo,monospace;white-space:pre-wrap">'+t.replace(/</g,'&lt;')+'</pre>');}else{alert(t);}return;}
const ADDDROP=location.href;
const w=window.open(SPEED+'#bridge','dlbot_win','width=1100,height=900');if(!w){alert('Popup blocked — allow popups for rtsports.com and click the bookmark again.');return;}
log('fetching your swap list from the Speed Kit page…');
let T=null;
const gotList=new Promise((res)=>{const h=(ev)=>{if(!ev.data||ev.data.type!=='desert-swaps')return;window.removeEventListener('message',h);res(ev.data);};window.addEventListener('message',h);setTimeout(()=>res(null),12000);});
(async()=>{
const msg=await gotList;
if(!msg){log('FAILED: no answer from the Speed Kit page (is it unlocked with your key in this browser?)');alert('Could not read the swap list from the Speed Kit page. Open it once in this browser, make sure it shows the list, then try again.');w.close();return;}
T=(msg.lines||'').split('\\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')).map(l=>{const m=l.match(/^(\\d+)\\s+(.+?)\\s+drop\\s+(\\d+)\\s+(.+)$/i);return m?{id:m[1],name:m[2].trim(),drop:m[3],dropName:m[4].trim()}:null;}).filter(Boolean);
if(!T.length){log('list is EMPTY — nothing to do. Write it on the Speed Kit page.');alert('Your Speed Kit list is empty.');w.close();return;}
log('mode '+MODE.toUpperCase()+' · '+T.length+' lines: '+T.map(t=>t.name+' for '+t.dropName).join(' | '));
w.location.href=ADDDROP;
function nextThu11(){const now=new Date();const f=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour12:false,weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'});const p=Object.fromEntries(f.formatToParts(now).map(x=>[x.type,x.value]));const secsNowCT=(+p.hour%24)*3600+(+p.minute)*60+(+p.second);const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday);let days=(4-dow+7)%7;if(days===0&&secsNowCT>=11*3600)days=7;const target=11*3600;return now.getTime()+((days*86400)+(target-secsNowCT))*1000;}
const goAt=MODE==='arm'?nextThu11():Date.now();const wait=goAt-Date.now();
if(wait>36*3600*1000){log('WARNING: next window is more than a day away; firing at '+new Date(goAt).toLocaleString()+' anyway.');}
if(wait<0){log('window is already open — going now');}else{log('bell at '+new Date(goAt).toLocaleTimeString()+' local, in '+Math.round(wait/1000)+'s — will sync to the rtsports server clock first');}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* server clock: rtsports' Date header (whole seconds) sampled fast enough to catch a second
   tick. Returns serverMs - localMs. On 9/17 this Mac ran 0.7s ahead of the server. */
async function serverOffset(){const S=[];const t0=Date.now();while(Date.now()-t0<2800){const a=Date.now();let d=null;try{d=(await fetch('/favicon.ico?'+a,{method:'HEAD',cache:'no-store'})).headers.get('date');}catch(e){}const b=Date.now();if(d&&!isNaN(Date.parse(d)))S.push({mid:(a+b)/2,sec:Date.parse(d),rtt:b-a});await sleep(120);}
  if(!S.length)return 0;let off=null;for(let i=1;i<S.length;i++){if(S[i].sec>S[i-1].sec){off=S[i].sec-S[i].mid;}}
  if(off===null){const s=S[S.length-1];off=s.sec+500-s.mid;}log('server clock is '+(Math.abs(off)/1000).toFixed(2)+'s '+(off<0?'behind':'ahead of')+' this Mac ('+S.length+' samples, rtt ~'+Math.round(S.reduce((x,y)=>x+y.rtt,0)/S.length)+'ms)');return off;}
async function spinUntil(localMs){const early=localMs-1500;if(Date.now()<early)await sleep(early-Date.now());while(Date.now()<localMs){}}
async function ready(){for(let i=0;i<120;i++){try{if(w.document&&w.document.readyState==='complete'&&typeof w.selectAddPlayer==='function'&&typeof w.SaveTransactions==='function'&&w.document.getElementById('fa-list'))return true;}catch(e){}await sleep(100);}return false;}
const onRoster=id=>{try{return !!w.document.getElementById('roster-player-'+id+'-name');}catch(e){return false;}};
function elig(id){try{return w.addEligibility(+id)||w.addEligibility(id);}catch(e){return {enabled:false,reason:'elig err '+e.message};}}
async function reloadUntilOpen(){for(let i=0;i<40;i++){w.location.reload();await sleep(200);if(!(await ready())){continue;}const e=elig(T[0].id);if(e&&e.enabled)return true;if(e&&/roster|already/i.test(e.reason||''))return true;log('not open yet: '+(e&&e.reason));await sleep(300);}return false;}
async function clearQueue(){try{if(w.hasUnsavedTransactions()){w.location.reload();await ready();}}catch(e){}}
const faPresent=id=>{try{return !!w.document.getElementById('fa-player-'+id+'-name');}catch(e){return false;}};
async function validateOnly(){ /* window closed: just prove every line resolves on the live page */
  let ok=0;for(const t of T){const a=faPresent(t.id),d=onRoster(t.drop);log((a&&d?'OK   ':'BAD  ')+t.name+(a?'':' [add not in free-agent list]')+' for '+t.dropName+(d?'':' [drop not on your roster]'));if(a&&d)ok++;}
  log('window is closed, so nothing was queued. '+ok+' of '+T.length+' lines are valid and ready for Thursday.');}
async function trySwap(t){
  if(onRoster(t.id)){log('already have '+t.name);return 'have';}
  const e=elig(t.id);if(!e||!e.enabled){log('skip '+t.name+': '+(e&&e.reason));return false;}
  if(!onRoster(t.drop)){log('skip '+t.name+': '+t.dropName+' is no longer on the roster');return false;}
  try{w.selectAddPlayer(+t.id);}catch(err){try{w.selectAddPlayer(t.id);}catch(e2){log('select failed '+t.name+': '+e2.message);return false;}}
  await sleep(120);let q=[];try{q=w.selectedAddIds()||[];}catch(e){}
  if(!q.map(String).includes(String(t.id))){log('not queued '+t.name);await clearQueue();return false;}
  const db=w.document.querySelector('button[data-drop-id="'+t.drop+'"]');if(!db){log('no DROP button for '+t.dropName);await clearQueue();return false;}
  db.click();await sleep(120);let dq=[];try{dq=w.selectedDropIds()||[];}catch(e){}
  if(!dq.map(String).includes(String(t.drop))){log('drop not queued: '+t.dropName);await clearQueue();return false;}
  if(MODE==='dry'){log('DRY RUN OK: '+t.name+' for '+t.dropName+' queued (would save now) — clearing');await clearQueue();return true;}
  try{const r=w.SaveTransactions(new w.Event('click'));if(r&&r.then)await r;}catch(err){log('save threw for '+t.name+': '+err.message);}
  for(let i=0;i<30;i++){await sleep(100);if(onRoster(t.id)){log('DONE: added '+t.name+', dropped '+t.dropName);return true;}}
  let un=null;try{un=w.hasUnsavedTransactions();}catch(e){}
  log('could not confirm '+t.name+' (unsaved='+un+') — reloading to check');w.location.reload();await ready();
  if(onRoster(t.id)){log('DONE (confirmed after reload): '+t.name);return true;}
  log('FAILED '+t.name+' — do this one by hand if you still want him');return false;}
  const usedDrops=new Set();let got=0;
  if(MODE==='dry'){await sleep(500);if(!(await ready())){log('popup did not load the Add/Drop page');return;}const e=elig(T[0].id);
    if(!(e&&e.enabled)&&!/roster|already/i.test((e&&e.reason)||'')){log('adds are closed right now ('+(e&&e.reason)+') — validating the list instead');await validateOnly();return;}}
  if(MODE==='arm'&&wait>0){
    /* timing plan (all on the SERVER clock): 45s out, measure the clock offset and reload so the
       page and its 1,200-row list are warm; then start the real reload ~0.4s BEFORE the bell so
       the request reaches the server just as it unlocks and the page lands open ~2.5s later. */
    const pre=goAt-45000; if(Date.now()<pre)await sleep(pre-Date.now());
    const off=await serverOffset(); const goLocal=goAt-off; log('bell on the server clock = '+new Date(goLocal).toLocaleTimeString()+'.'+String(goLocal%1000|0).padStart(3,'0')+' local');
    w.location.reload();await ready();log('page pre-warmed');
    await spinUntil(goLocal-400);log('GO — reloading into the open window');w.location.reload();await sleep(150);
    if(await ready()){const e=elig(T[0].id);if(e&&(e.enabled||/roster|already/i.test(e.reason||''))){log('page landed open '+((Date.now()-goLocal)/1000).toFixed(2)+'s after the bell');}else{log('landed early ('+(e&&e.reason)+') — retrying');if(!(await reloadUntilOpen())){log('never unlocked; do it by hand NOW');return;}}}
    else if(!(await reloadUntilOpen())){log('never unlocked; do it by hand NOW');return;}
  }else{ if(wait>0)await sleep(wait); log('GO — reloading the add page'); if(!(await reloadUntilOpen())){log('never unlocked; do it by hand NOW');return;} }
  for(const t of T){
    if(usedDrops.has(t.drop))continue;
    const r=await trySwap(t);
    if(r===true){got++;usedDrops.add(t.drop);}
    else if(r==='have'){usedDrops.add(t.drop);}
    if(!(await ready())){await reloadUntilOpen();}
  }
  log('done — '+got+(MODE==='dry'?' swaps rehearsed (nothing saved).':' swaps made. Check the roster in the other window.')+' Click the Bot Log bookmark any time to see this again.');
})();})();`;
}
/* bridge: opened by the bookmarklet as the popup — hand back the saved list and wait to be navigated away */
if(location.hash==='#bridge'&&window.opener){
  const lines=COACH?(localStorage.getItem('desert.targets3')||''):'';
  try{ window.opener.postMessage({type:'desert-swaps',lines},'https://www.rtsports.com'); }catch(e){}
  try{ window.opener.postMessage({type:'desert-swaps',lines},'https://rtsports.com'); }catch(e){}
  document.getElementById('main').innerHTML='<div id="gate">'+(COACH?'List sent to the bot…':'Locked — open the Speed Kit with your key first')+'</div>';

function renderSpeed(){
  // Priority order for the bot = list order. Defenses get contested at the bell (they
  // score most among the churn slots), kickers almost never do — so D/ST first, then
  // skill players by gain, kickers last.
  const PRI={DST:0,RB:1,WRTE:1,QB:1,K:2};
  const plan=swapPlan(me.roster,5,6).sort((a,b)=>(PRI[slot(a.p)]-PRI[slot(b.p)])||(b.gain-a.gain));
  const lines=[]; const missing=[];
  for(const x of plan){
    const cands=[x.p].concat(x.backups);
    for(const c of cands){ if(c.rts_id&&x.drop.rts_id) lines.push(`${c.rts_id} ${c.name} drop ${x.drop.rts_id} ${x.drop.name}`); else missing.push(c.name+(x.drop.rts_id?'':' / '+x.drop.name)); }
  }
  const SUGGESTED=lines.join('\n');
  // Jerry's list is HIS: it persists across rebuilds and is never overwritten automatically.
  const saved=localStorage.getItem('desert.targets3'); const hasOwn=saved!=null&&saved.trim().length>0;
  const myIds=me.roster.map(id=>P[id]).map(p=>`${p.rts_id||'?????'} ${p.name}`).join('\n');
  const myOpts=me.roster.map(id=>P[id]).sort((a,b)=>SLOT_KEYS.indexOf(slot(a))-SLOT_KEYS.indexOf(slot(b))||b.pts-a.pts).map(p=>`<option value="${p.id}">${p.pos==='DST'?'D/ST':p.pos} · ${esc(p.name)} (${Math.round(p.pts)})</option>`).join('');
  main.innerHTML=`
  <h1>Thursday speed kit <small>Adds open Thursday 11:00:00 AM Central · first click wins · this clicks for you</small></h1>
  <div class="card hot"><h2>1 · Drag these four to your bookmarks bar</h2>
    <p style="display:flex;gap:10px;flex-wrap:wrap"><a class="bm" id="bm" href="#">⚡ Desert Bot</a> <a class="bm" id="bm-now" href="#" style="background:#7a5c12;border-color:#ffd166">▶ Bot NOW</a> <a class="bm" id="bm-dry" href="#" style="background:#1e6a49;border-color:#8ff0c2">🧪 Dry Run</a> <a class="bm" id="bm-log" href="#" style="background:#2d3749;border-color:#93a0b4">📋 Bot Log</a></p>
    <ul style="margin:10px 0 0 18px;line-height:1.7">
      <li><b>⚡ Desert Bot</b> — arms and waits for Thursday 11:00 AM CT. 45 seconds out it syncs to the rtsports server clock and pre-loads the page; it starts the reload a hair before the bell so the page lands already open, then saves your swaps in order, about a second each. The real one.</li>
      <li><b>▶ Bot NOW</b> — same bot, fires immediately. For a live test while the window is open (Thu 11 AM – Sun noon CT).</li>
      <li><b>🧪 Dry Run</b> — never saves. While the window is closed (Sun noon–Thu 11) it validates every line against the live lists; while open, it queues each swap, confirms the site accepted it, and clears.</li>
      <li><b>📋 Bot Log</b> — opens the timestamped log from the last run.</li>
    </ul>
    <p class="dim" style="margin-top:10px">Drag each onto Chrome's bookmarks bar (View → Always Show Bookmarks Bar) <b>once</b>. When clicked, they fetch whatever list is saved on this page at that moment, so editing the list never requires re-dragging. Outside the add window, 🧪 Dry Run checks every line against the live free-agent list and your roster and reports which are valid.</p></div>
  <div class="card"><h2>2 · Thursday, 10:50 AM</h2>
    <ol>
      <li>Chrome on the Mac, logged into RTSports, on Desert League → <b>Add/Drop Players</b>. Mac awake, no sleep.</li>
      <li>10:55: click <b>⚡ Desert Bot</b>. A second Add/Drop window opens (allow popups for rtsports.com if asked, then click again). The green log box shows the countdown.</li>
      <li>Start a screen recording (Cmd+Shift+5) and leave both windows alone through 11:01.</li>
      <li>Any line the log marks <span class="bad">FAILED</span>, do by hand in the popup. Then message me; I can read the log from your browser.</li>
    </ol></div>
  <div class="card"><h2>3 · Wednesday night: write the swaps</h2>
    <p class="dim" style="margin-bottom:8px">Pick who you're dropping, then who you want — the list only shows free agents in the same slot, best first. Add a backup line for the same drop right after it: if the first guy is gone at the bell, the bot tries the next. Nothing on this page decides for you; the bot runs exactly these lines, <b>top to bottom, about 3 seconds each</b> — so put the swap most likely to be contested (usually the defense) at the top. Suggested lists come out D/ST first, kickers last.</p>
    <div class="row" style="margin-bottom:10px">

    document.getElementById('cnt').textContent=t.length+' lines · '+new Set(t.map(x=>x.drop)).size+' distinct drops';
    const bad=ta.value.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')).filter(l=>!/^\d+\s+.+?\s+drop\s+\d+\s+.+$/i.test(l));
    const sv=document.getElementById('saved');
    if(!t.length){ sv.innerHTML='<b style="color:var(--bad)">Nothing saved</b> — the list is empty, so the bot will do nothing on Thursday.'; sv.style.borderLeftColor='var(--bad)'; }
    else { sv.innerHTML=`<b class="good">Saved ✓</b> ${t.length} swap${t.length>1?'s':''} at ${new Date().toLocaleTimeString()} — this is what the bot will run:<br>`+t.map((x,i)=>`${i+1}. ${esc(x.name)} <span class="dim">for</span> ${esc(x.dropName)}`).join('<br>')+(bad.length?`<br><span class="bad">Ignored (bad format): ${esc(bad.join(' · '))}</span>`:''); sv.style.borderLeftColor='var(--good)'; } }
  ta.addEventListener('input',upd);
  document.getElementById('suggest').onclick=()=>{ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+SUGGESTED;upd();};
  document.getElementById('clear').onclick=()=>{if(confirm('Clear the whole list?')){ta.value='';upd();}};

    if(!f.rts_id||!d.rts_id){alert('Missing an rtsports id for that player.');return;}
    ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+`${f.rts_id} ${f.name} drop ${d.rts_id} ${d.name}`; upd(); pa.value=''; };
  document.querySelectorAll('.bm').forEach(a=>a.addEventListener('click',e=>{e.preventDefault(); alert('Drag it to the bookmarks bar, then click it from there while on the rtsports Add/Drop page.');}));
  upd();
}
